<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Plan your week, log sets and track your progress.">
  <title>Gym Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('gymmanager.v1') || '{}');
      var t = s.settings && s.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <nav id="nav" aria-label="Main"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="rest-root" aria-live="off"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>Gym Manager needs JavaScript.</noscript>

  <script src="config.js"></script>
  <script src="data/exercises.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/workout.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
